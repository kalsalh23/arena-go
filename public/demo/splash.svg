<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#071a2b"/><stop offset="0.55" stop-color="#0d2f22"/><stop offset="1" stop-color="#0c241a"/>
</linearGradient>
<linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#155c34"/><stop offset="1" stop-color="#0a3b21"/>
</linearGradient>
<radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="rgba(255,248,214,0.9)"/><stop offset="0.3" stop-color="rgba(255,244,180,0.28)"/><stop offset="1" stop-color="rgba(255,244,180,0)"/>
</radialGradient>
<radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="rgba(255,252,235,0.5)"/><stop offset="1" stop-color="rgba(255,252,235,0)"/>
</radialGradient>
</defs>

<rect width="800" height="1200" fill="url(#sky)"/>

<!-- stadium rim + crowd -->
<rect y="330" width="800" height="150" fill="#0f2d1f"/>
<g fill="#1b3c2c">
<rect y="318" width="800" height="14" rx="7"/>
</g>
<g opacity="0.85">
<g fill="#d9c36a"><circle cx="60" cy="370" r="5"/><circle cx="150" cy="392" r="5"/><circle cx="240" cy="368" r="5"/><circle cx="330" cy="394" r="5"/><circle cx="420" cy="370" r="5"/><circle cx="510" cy="392" r="5"/><circle cx="600" cy="368" r="5"/><circle cx="690" cy="394" r="5"/><circle cx="760" cy="372" r="5"/></g>
<g fill="#9fd0ff"><circle cx="105" cy="394" r="5"/><circle cx="195" cy="370" r="5"/><circle cx="285" cy="392" r="5"/><circle cx="375" cy="368" r="5"/><circle cx="465" cy="394" r="5"/><circle cx="555" cy="370" r="5"/><circle cx="645" cy="392" r="5"/><circle cx="735" cy="368" r="5"/></g>
<g fill="#ff9d9d"><circle cx="80" cy="418" r="5"/><circle cx="170" cy="416" r="5"/><circle cx="260" cy="418" r="5"/><circle cx="350" cy="416" r="5"/><circle cx="440" cy="418" r="5"/><circle cx="530" cy="416" r="5"/><circle cx="620" cy="418" r="5"/><circle cx="710" cy="416" r="5"/></g>
<g fill="#ffffff"><circle cx="125" cy="440" r="5"/><circle cx="215" cy="440" r="5"/><circle cx="305" cy="440" r="5"/><circle cx="395" cy="440" r="5"/><circle cx="485" cy="440" r="5"/><circle cx="575" cy="440" r="5"/><circle cx="665" cy="440" r="5"/><circle cx="755" cy="440" r="5"/></g>
</g>

<!-- floodlights -->
<g><rect x="96" y="150" width="8" height="180" fill="#37504a"/><rect x="60" y="120" width="80" height="30" rx="8" fill="#2b3f39"/><ellipse cx="100" cy="140" rx="150" ry="70" fill="url(#glow1)"/></g>
<g><rect x="696" y="150" width="8" height="180" fill="#37504a"/><rect x="660" y="120" width="80" height="30" rx="8" fill="#2b3f39"/><ellipse cx="700" cy="140" rx="150" ry="70" fill="url(#glow1)"/></g>

<!-- pitch -->
<rect y="480" width="800" height="720" fill="url(#grass)"/>
<g stroke="rgba(255,255,255,0.5)" stroke-width="4" fill="none">
<line x1="0" y1="560" x2="800" y2="560"/>
<ellipse cx="400" cy="700" rx="130" ry="46"/>
</g>
<ellipse cx="400" cy="760" rx="420" ry="260" fill="url(#spot)"/>

<!-- silhouettes: world stars celebrating -->
<g fill="#08130d">
<!-- runner -->
<g transform="translate(150,600) scale(1.15)">
<circle cx="0" cy="0" r="24"/>
<path d="M-6 22 L-2 92 L-34 150 L-14 154 L18 100 L14 60"/>
<path d="M-2 92 L34 128 L56 122 L38 108 L6 84"/>
<path d="M-4 40 L-52 70 L-60 96 L-38 78 L2 52"/>
<path d="M-4 40 L44 18 L74 30 L46 40 L2 58"/>
</g>
<!-- arms-up celebration -->
<g transform="translate(420,585) scale(1.35)">
<circle cx="0" cy="0" r="24"/>
<path d="M-8 24 L0 95 L-6 160 L16 160 L10 100 L8 24"/>
<path d="M-6 40 L-46 -20 L-32 -34 L-2 24"/>
<path d="M-4 36 L44 -22 L32 -36 L-2 20"/>
<path d="M-4 100 L-40 160 L-18 164 L6 118"/>
</g>
<!-- header jump -->
<g transform="translate(660,640) scale(1.1)">
<circle cx="0" cy="-40" r="23"/>
<path d="M-8 -16 L-2 60 L-8 130 L12 130 L8 64 L6 -16"/>
<path d="M-6 0 L-50 -34 L-38 -52 L-2 -18"/>
<path d="M-4 -4 L40 -44 L54 -28 L2 8"/>
</g>
<!-- dribbling -->
<g transform="translate(280,860) scale(1.05)">
<circle cx="0" cy="0" r="22"/>
<path d="M-6 20 L2 88 L-20 150 L0 154 L22 96 L16 20"/>
<path d="M0 88 L40 118 L60 110 L42 98 L8 78"/>
</g>
<!-- goalkeeper dive -->
<g transform="translate(560,880) scale(1.05)">
<circle cx="-40" cy="-10" r="22"/>
<path d="M-24 0 L30 30 L58 78 L42 88 L8 44 L-30 22"/>
<path d="M-20 6 L-60 40 L-52 58 L-16 28"/>
</g>
</g>

<!-- ball -->
<circle cx="180" cy="960" r="30" fill="#ffffff"/>
<path d="M180 936 l12 9 -5 15 h-14 l-5-15 z" fill="#0c241a"/>

<!-- vignette -->
<rect width="800" height="1200" fill="rgba(6,20,14,0.18)"/>
</svg>
